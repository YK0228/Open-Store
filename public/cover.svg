<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Ambient Grid / Accents -->
  <circle cx="1050" cy="120" r="320" fill="#d97706" opacity="0.08" filter="blur(80px)" />
  <circle cx="150" cy="520" r="280" fill="#f59e0b" opacity="0.05" filter="blur(60px)" />

  <!-- Top Badge -->
  <g transform="translate(100, 110)">
    <rect width="250" height="42" rx="21" fill="url(#badgeGlow)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#f59e0b" />
    <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#fbbf24" letter-spacing="1">微型創業第一站・AI 導航</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(100, 240)">
    <!-- Storefront Icon Accent -->
    <rect x="0" y="-55" width="68" height="68" rx="18" fill="url(#accent)" />
    <path d="M18 -21 L34 -37 L50 -21 L50 -7 L18 -7 Z M26 -7 L26 -17 L42 -17 L42 -7 Z" fill="#ffffff" />

    <text x="88" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">
      開店通 <tspan fill="#f59e0b">|</tspan> 啟動你的微型創業
    </text>
  </g>

  <!-- Description -->
  <g transform="translate(100, 315)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="24" font-weight="500" fill="#e7e5e4" letter-spacing="0.5">
      專為 28-40 歲上班族與斜槓青年打造的實體創業避坑體檢平台
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" fill="#a8a29e">
      快速掌握開店必備資源、青年創業貸款政策與數位轉型策略，立即啟動你的創業計畫。
    </text>
  </g>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 430)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="310" height="96" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.2" />
      <circle cx="36" cy="48" r="18" fill="#f59e0b" fill-opacity="0.15" />
      <text x="36" y="54" text-anchor="middle" font-size="18">⚡</text>
      <text x="68" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI 創業適性體檢</text>
      <text x="68" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e">3 分鐘精算預算與資金缺口</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(345, 0)">
      <rect width="310" height="96" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.2" />
      <circle cx="36" cy="48" r="18" fill="#10b981" fill-opacity="0.15" />
      <text x="36" y="54" text-anchor="middle" font-size="18">🏛️</text>
      <text x="68" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">政策低利貸款匹配</text>
      <text x="68" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e">青創 100 萬免保人攻略</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(690, 0)">
      <rect width="310" height="96" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.2" />
      <circle cx="36" cy="48" r="18" fill="#3b82f6" fill-opacity="0.15" />
      <text x="36" y="54" text-anchor="middle" font-size="18">🛡️</text>
      <text x="68" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">水電裝潢避坑庫</text>
      <text x="68" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13" fill="#a8a29e">前輩血淚合約防守底線</text>
    </g>
  </g>

  <!-- Watermark URL bottom right -->
  <text x="1100" y="585" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#78716c" letter-spacing="1">
    open-store.pages.dev
  </text>
</svg>
